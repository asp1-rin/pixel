<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d12" />
<link rel="manifest" href="/manifest.webmanifest" />
<title>Pixel Mobile</title>
<style>
  :root { --bg:#0b0d12; --panel:#141826; --panel2:#1c2236; --line:#283047;
          --txt:#e6e9f2; --dim:#8b93ad; --ok:#3ddc84; --err:#ff5d6c; --acc:#5b8cff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt);
              font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  body { padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 12px); }
  header { display:flex; align-items:center; gap:8px; padding:12px 2px; }
  header b { font-size:16px; letter-spacing:.5px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--err); transition:.2s; }
  .dot.on { background:var(--ok); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px;
          padding:14px; margin:0 0 12px; }
  .card h3 { margin:0 0 10px; font-size:12px; color:var(--dim);
             text-transform:uppercase; letter-spacing:1px; }
  .row { display:flex; gap:8px; align-items:center; }
  input, button, textarea {
    font:inherit; color:var(--txt); background:var(--panel2);
    border:1px solid var(--line); border-radius:10px; padding:11px 12px; }
  input, textarea { width:100%; }
  button { background:var(--acc); border:none; font-weight:600; min-width:84px;
           padding:11px 14px; }
  button.sec { background:var(--panel2); border:1px solid var(--line); }
  button:active { opacity:.7; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .tg { display:flex; justify-content:space-between; align-items:center;
        background:var(--panel2); border:1px solid var(--line);
        border-radius:10px; padding:10px 12px; }
  .tg.active { border-color:var(--ok); }
  .sw { width:42px; height:24px; border-radius:14px; background:var(--line);
        position:relative; flex:none; }
  .sw i { position:absolute; top:3px; left:3px; width:18px; height:18px;
          border-radius:50%; background:#fff; transition:.18s; }
  .tg.active .sw { background:var(--ok); } .tg.active .sw i { left:21px; }
  .stat { display:flex; justify-content:space-between; padding:6px 0;
          border-bottom:1px solid var(--line); font-size:13px; }
  .stat:last-child { border:0; } .stat span:last-child { color:var(--dim); }
  #log { height:170px; overflow:auto; background:#080a10; border:1px solid var(--line);
         border-radius:10px; padding:10px; font:12px/1.4 ui-monospace,Menlo,monospace;
         color:#b9c2dc; white-space:pre-wrap; word-break:break-word; }
  textarea { height:64px; resize:vertical; font-family:ui-monospace,monospace; }
  small { color:var(--dim); }
</style>
</head>
<body>
<header><div class="dot" id="dot"></div><b>PIXEL MOBILE</b><small id="conn">connecting…</small></header>

<div class="card">
  <h3>Player</h3>
  <div class="row">
    <input id="epos" inputmode="numeric" placeholder="EPOS number (in-game id)" />
    <button id="scan">Lock</button>
  </div>
</div>

<div class="card">
  <h3>Status</h3>
  <div class="stat"><span>Module</span><span id="s-mod">—</span></div>
  <div class="stat"><span>EPOS</span><span id="s-epos">—</span></div>
  <div class="stat"><span>Entities</span><span id="s-ent">—</span></div>
</div>

<div class="card">
  <h3>Cheats</h3>
  <div class="grid" id="cheats"></div>
  <div class="row" style="margin-top:8px">
    <input id="newcheat" placeholder="add cheat id (e.g. no-recoil)" />
    <button class="sec" id="addcheat">Add</button>
  </div>
</div>

<div class="card">
  <h3>Command</h3>
  <textarea id="cmd" spellcheck="false" placeholder='["scan-epos"]'></textarea>
  <div class="row" style="margin-top:8px">
    <button id="sendcmd">Send</button>
    <small>Raw protocol array. Full agent access.</small>
  </div>
</div>

<div class="card">
  <h3>Log</h3>
  <div id="log"></div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var LS = {
    get: function (k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  var cheats   = LS.get('pixel.cheats', {});
  var keybinds = LS.get('pixel.keybinds', {});
  var config   = LS.get('pixel.config', { frame: 60 });
  var cheatIds = LS.get('pixel.cheatIds',
    ['no-recoil', 'no-spread', 'infinite-ammo', 'one-kill', 'no-clip', 'fly']);

  function post(arr) {
    return fetch('/cmd', { method: 'POST', body: JSON.stringify(arr) }).catch(function () {});
  }
  function logLine(s) {
    var el = $('log');
    el.textContent += (el.textContent ? '\n' : '') + s;
    el.scrollTop = el.scrollHeight;
  }

  function renderCheats() {
    var box = $('cheats'); box.innerHTML = '';
    cheatIds.forEach(function (id) {
      var on = !!cheats[id];
      var d = document.createElement('div');
      d.className = 'tg' + (on ? ' active' : '');
      d.innerHTML = '<span>' + id + '</span><div class="sw"><i></i></div>';
      d.onclick = function () {
        on = !on; cheats[id] = on; LS.set('pixel.cheats', cheats);
        d.className = 'tg' + (on ? ' active' : '');
        post(['cheats', id, on]);
      };
      box.appendChild(d);
    });
  }
  renderCheats();

  $('addcheat').onclick = function () {
    var v = $('newcheat').value.trim();
    if (v && cheatIds.indexOf(v) < 0) { cheatIds.push(v); LS.set('pixel.cheatIds', cheatIds); renderCheats(); }
    $('newcheat').value = '';
  };
  $('epos').value = LS.get('pixel.epos', '');
  $('scan').onclick = function () {
    var n = $('epos').value.trim();
    LS.set('pixel.epos', n);
    if (n) { config['epos-number'] = n; LS.set('pixel.config', config); post(['config', 'epos-number', n]); }
    post(['scan-epos']);
  };
  $('sendcmd').onclick = function () {
    try { post(JSON.parse($('cmd').value)); logLine('> ' + $('cmd').value); }
    catch (e) { logLine('! invalid JSON'); }
  };

  // ---- live event stream from the agent (Frida send() -> SSE) ----
  function setConn(ok) {
    $('dot').className = 'dot' + (ok ? ' on' : '');
    $('conn').textContent = ok ? 'connected' : 'reconnecting…';
  }
  function onPayload(p) {
    if (!Array.isArray(p)) return;
    var ch = p[0];
    if (ch === 'log') logLine(p.slice(1).join(' '));
    else if (ch === 'epos-state') { $('s-epos').textContent = p[1] + (p[2] ? ' · ' + p[2] : ''); }
    else if (ch === 'entity-state') { $('s-ent').textContent = (p[1] || '') + (p[2] ? ' ' + p[2] : ''); }
    else if (ch === 'Address.init') { $('s-mod').textContent = p[1]; logLine('module @ ' + p[1]); }
    else logLine(JSON.stringify(p));
  }
  function connect() {
    var es = new EventSource('/events');
    es.onopen = function () {
      setConn(true);
      // Replay state to the freshly-(re)attached agent, exactly like the
      // desktop host's first script.post(['init', ...]).
      post(['init', cheats, keybinds, config, []]);
    };
    es.onmessage = function (ev) {
      try { var m = JSON.parse(ev.data); if (m && m.__pixel === 'send') onPayload(m.payload); }
      catch (e) {}
    };
    es.onerror = function () { setConn(false); /* EventSource auto-retries */ };
  }
  connect();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function () {});
})();
</script>
</body>
</html>
